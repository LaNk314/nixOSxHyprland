# hyprlock 0.9 — składnia hyprlang (nie Lua, inaczej niż hyprland.lua)
# Czyszczenie wpisanego hasła: ESC, Ctrl+U

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# tło: zrzut bieżącego ekranu, rozmyty (przy wolnym renderowaniu zmniejsz blur_passes albo użyj color)
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 6
    color = rgb(1e1e2e)
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Hasło...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

# zegar
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# data
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}
