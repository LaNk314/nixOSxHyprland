# hypridle 0.1 — składnia hyprlang. Start: autostart w hyprland.lua.

general {
    lock_cmd = pidof hyprlock || hyprlock                            # jedna instancja hyprlocka
    before_sleep_cmd = loginctl lock-session                         # blokada przed uśpieniem
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # ekran od razu po wybudzeniu
}

# 5 min: blokada
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 min: wygaszenie ekranu.
